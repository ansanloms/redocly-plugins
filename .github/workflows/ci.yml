name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run compile
      - name: Smoke test with packed tarball
        run: |
          tgz=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-save "$RUNNER_TEMP/$tgz"
          node --input-type=module -e '
            const mod = await import("@ansanloms/redocly-plugins");
            const plugin = mod.default();
            if (plugin.id !== "ansanloms") throw new Error("unexpected id: " + plugin.id);
            for (const kind of ["preprocessors", "rules"]) {
              const entries = Object.entries(plugin[kind].oas3);
              if (entries.length === 0) throw new Error(kind + " is empty");
              for (const [name, value] of entries) {
                if (typeof value !== "function") throw new Error(kind + " is not a function: " + name);
              }
            }
            for (const name of ["createPlugin", "expectedOperationId"]) {
              if (typeof mod[name] !== "function") throw new Error("export missing: " + name);
            }
          '
      - name: Verify working tree is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
